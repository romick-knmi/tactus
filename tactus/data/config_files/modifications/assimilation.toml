# Data assimilation modification file
# ------------------------------------------------------------------
# Enables the CANARI (surface OI) + 3D-Var upper-air assimilation
# chain between FirstGuess and Forecast.
#
# Usage:
#   tactus case @<config_file> assimilation.toml -o <output.toml> --start-suite
#
# Required: fill in [da] paths below for your site / experiment.
# ------------------------------------------------------------------

# submission
[submission]
bindir = "/lus/h2resw01/scratch/sis/tactus/CY50t2_AROME_DKCOEXP_20250209/install/bin/"
#bindir = "/perm/sis/tactus_bin/@CYCLE@/@COMPILER@/@PRECISION@/bin"
precision = "R64"

[system]
assimilation_input_definition = "@CYCLE@/assimilation.json"

[suite_control]
  do_assimilation = true
  mode = "start"
# ------------------------------------------------------------------
# DA section — paths and tuning
# ------------------------------------------------------------------
[da]
  # Root directory for pre-processed observation files (OPLACE / local)
  # Expected layout: <obs_dir>/YYYY/MM/DD/<obstype_filename>[.gz]
  # obs_dir = "@SCRATCH@/da/@CASE@/obs"
  obs_dir = "/scratch/sis/da/obs/"

  # Per-cycle scratch store for intermediate DA files (ODB, CCMA, analyses)
  scratch = "@SCRATCH@/@CASE@/da"

  # Directory containing DA constants:
  #   B-matrix (stabal96.cv/bal), error files (errgrib*),
  #   RTTOV coefficients, blacklists (LISTE_NOIRE_DIAP, LISTE_LOC),
  #   param_bator.cfg, param_obsconvert.cfg, param_rgb.
  const_dir = "/perm/sis/da/const"
  # Short-range background (first-guess) directory.
  # Expected files: <guess_dir>/YYYY/MM/DD/guess.YYYYMMDDRR[.gz]
  guess_dir = "@SCRATCH@/da/@CASE@/guess"

  # Archive directory for final DA analysis fields.
  # Forecast uses: <analysis_dir>/YYYY/MM/DD/analysis.YYYYMMDDRR
  analysis_dir = "@SCRATCH@/da/@CASE@/analysis"

  # Variational bias correction (VARBC) archive.
  # Expected: <varbc_dir>/YYYY/MM/DD/VARBC.cycle_<RR>
  varbc_dir = "@SCRATCH@/da/@CASE@/varbc"

  # Warm-start VarBC: used when no cycling varbc_dir entry exists and
  # the experiment is not a bgcycle cold start.
  varbc_init_dir = "/perm/sis/da/varbc_init"

  # RTTOV satellite channel coefficient files
  rttov_coef_dir = "/perm/sis/da/const/rttov"

  # JSON file (relative to tactus data/input_definitions/) describing static
  # constant files that OopsVar links into its working directory.
  oovar_input_definition = "CY50t2/oovar_input_definition.json"

  # Number of ODB pools used by BATOR / SHUFFLE
  nbpool = 16

  # Cold-start basetime (YYYYMMDDRR): skips VARBC / first-guess checks.
  # Set to the first cycle of a new experiment.
  bgcycle = ""

  # Enable OpenMP threading in MASTERODB screening step
  openmp = true

  # Run the upper-air 3D-Var chain after the surface OI chain
  # (tactus default is false; see "Surface-only DA mode" below)
  upper_air = true

  odb_task_surface = "Obsconvert"   # default, can be "Bator"
  odb_task_3dvar   = "Obsconvert"        # default, can be "Obsconvert"

  # Observation types for CANARI surface analysis (obsprep + BATOR)
  obs_types_surface = ["synop"]

  # Observation types for 3D-Var upper-air analysis
  obs_types_3dvar = [
    "synop", "gpssol",
    "amdar", "geowind", "temp", "wp",
    "seviri", "amsua", "amsub", "iasi", "ascat",
  ]

  # ------------------------------------------------------------------
  # Active observation network  ← the only line a user needs to change
  # ------------------------------------------------------------------
  # Names the [da.providers.<name>] block that ObsPrep will use to locate
  # observation files.  All network conventions are defined below in the
  # [da.providers.*] registry; no code changes are needed to switch or to
  # add a new network.
  obs_provider = "LACE"

# ------------------------------------------------------------------
# BATOR window / slot configuration
# ------------------------------------------------------------------
  bator_window_len   = 180   # window length [minutes], symmetric around analysis time
  bator_window_shift = -90   # window start offset [minutes] (negative = before)
  bator_slot_len     = 0     # slot length [minutes]; 0 = single slot
  bator_nbslot       = 1     # number of BATOR time slots

  # Path to the obsoul_merge.pl script used to merge multiple OBSOUL files.
  # Supports @CYCLE@, @COMPILER@, @PRECISION@ substitutions.
  obsoul_merge_script = "/perm/sis/tactus_bin/@CYCLE@/@COMPILER@/@PRECISION@/bin/obsoul_merge.pl"

# ------------------------------------------------------------------
# GPS station whitelist for BATOR (list_gpssol)
# ------------------------------------------------------------------
  gpssol_stations = []

# ==================================================================
# Observation network registry
# ==================================================================
# Each [da.providers.<NAME>] block defines one observation provider.
# ObsPrep reads the block selected by da.obs_provider at runtime.
#
# Network-level settings:
#   obs_step  — minutes between archive file slots.
#               0 = single slot at basetime (windowing disabled).
#               60 = hourly archive; all slots inside the assimilation
#                    window are searched and results merged.
#
# Per-obstype sub-tables ([da.providers.<NAME>.obstypes.<obstype>]):
#   format      — file format: "OBSOUL", "BUFR", "NETCDF", "GRIB".
#                 local_name is derived as "<format>.<obstype>".
#   candidates  — filename templates tried in order.  All matches
#                 across all window slots are collected and merged.
#                 Placeholders: {ymdrr}, {yyyy}, {mm}, {dd}, {rr}.
#   obs_step    — optional per-obstype override of the provider obs_step.
#   source_dir  — optional; overrides da.obs_dir/YYYY/MM/DD as the
#                 search root (supports @PLATFORM@ substitutions).
# ==================================================================

# ------------------------------------------------------------------
# LACE — Central-European limited-area consortium convention.
# Conventional obs in per-country OBSOUL files; satellite in BUFR/NETCDF.
# Files are stored as hourly chunks; obs_step=60 collects the full window.
# ------------------------------------------------------------------
[da.providers.LACE]
obs_step = 60

[da.providers.LACE.obstypes.synop]
obs_step   = 0
format     = "OBSOUL"
candidates = [
  "obsoul_1_xxxxxx_hu_{ymdrr}",
  "obsoul_1_xxxxxy_hu_{ymdrr}",
  "obsoul_1_xxxxxy_at_{ymdrr}",
  "obsoul_1_xxxxxy_cz_{ymdrr}",
  "obsoul_1_xxxxxy_sk_{ymdrr}",
  "obsoul_1_xxxxxy_ro_{ymdrr}",
  "obsoul_1_xxxxxy_si_{ymdrr}",
  "obsoul_1_xxxxxy_cr_{ymdrr}",
  "obsoul_1_xxxxxy_pl_{ymdrr}",
]

[da.providers.LACE.obstypes.gpssol]
format     = "BUFR"
candidates = ["bufr_1_ztd_egvap_{ymdrr}"]

[da.providers.LACE.obstypes.amdar]
format     = "OBSOUL"
candidates = ["obsoul_2_xxxxxx_xx_{ymdrr}", "obsoul_2_ehs_eu_{ymdrr}"]

[da.providers.LACE.obstypes.geowind]
obs_step   = 0
format     = "BUFR"
candidates = ["bufr_3_geowind_xx_{ymdrr}"]

[da.providers.LACE.obstypes.temp]
format     = "OBSOUL"
candidates = ["obsoul_5_xxxxxx_xx_{ymdrr}"]

[da.providers.LACE.obstypes.wp]
format     = "OBSOUL"
candidates = ["obsoul_6_xxxxxx_xx_{ymdrr}"]

[da.providers.LACE.obstypes.amsua]
format     = "BUFR"
candidates = [
  "bufr_7_amsua_metopc_{ymdrr}",
  "bufr_7_amsua_metopb_{ymdrr}",
  "bufr_7_amsua_noaa18_{ymdrr}",
  "bufr_7_amsua_noaa19_{ymdrr}",
]

[da.providers.LACE.obstypes.amsub]
format     = "BUFR"
candidates = [
  "bufr_7_mhs_metopc_{ymdrr}",
  "bufr_7_mhs_metopb_{ymdrr}",
  "bufr_7_mhs_noaa19_{ymdrr}",
]

[da.providers.LACE.obstypes.seviri]
obs_step   = 0
format     = "NETCDF"
candidates = ["netcdf_7_seviri_xx_{ymdrr}"]

[da.providers.LACE.obstypes.iasi]
format     = "BUFR"
candidates = [
  "bufr_7_iasi_metopb_{ymdrr}",
  "bufr_7_iasi_metopc_{ymdrr}",
]

[da.providers.LACE.obstypes.ascat]
format     = "BUFR"
candidates = [
  "bufr_9_ascatC_metopb_{ymdrr}",
  "bufr_9_ascatC_metopc_{ymdrr}",
]

# ------------------------------------------------------------------
# UWC — United Weather Centres / ECMWF OPLACE convention (SAPP output).
#
# All conventional observations arrive in a single consolidated BUFR
# file whose name follows one of several site conventions.  ObsPrep
# tries each candidate template in order and splits the first match
# into per-type BUFR files using eccodes bufr_filter.
#
# Satellite observations are sourced independently via their own
# candidates lists and are NOT affected by the conv_bufr_source logic.
#
# CONSOLIDATED BUFR SPLIT KEYS:
#   obs_step        = 0   The consolidated file already covers the full
#                         assimilation window; per-slot windowing is off.
#   conv_bufr_source      Candidate filename templates, tried in order.
#                         Placeholders: {ymdrr}, {yyyy}, {mm}, {dd}, {rr}.
#   conv_bufr_filter      Path to the eccodes filter that splits by
#                         BUFR category into BUFR.<type> output files.
#   conv_split_types      Explicit list of obs types produced by the
#                         filter.  ONLY these types bypass normal
#                         candidates-based staging.  Must match the
#                         obstype keys defined below (e.g. [.obstypes.synop]).
#
# Adding a new conventional obs type sourced from the split:
#   1. Add the type to conv_split_types.
#   2. Add a matching [da.providers.UWC.obstypes.<type>] block with
#      format = "BUFR" (or local_name if the filter output differs).
#   3. Add the corresponding write statement to conv_bufr_split.filter.
#   4. Add the type to da.obs_types_3dvar (or obs_types_surface).
#   No Python code changes are needed.
# ------------------------------------------------------------------
[da.providers.UWC]

# Consolidated BUFR already spans the full DA window; no slot iteration.
obs_step = 0

# Candidate consolidated conventional BUFR filenames (tried in order).
# Real-world examples:
#   ob2025020900                 -> matches "ob{ymdrr}"
#   BUFR01002025020900.DAT       -> matches "BUFRXXXX{ymdrr}.dat" (case-insensitive FS)
#   sapp1_BUFR00012025020900.DAT -> matches "XXXXX_BUFRXXXX{ymdrr}.DAT"
conv_bufr_source = [
  "ob{ymdrr}",
  "BUFRXXXX{ymdrr}.dat",
  "XXXXX_BUFRXXXX{ymdrr}.DAT",
]

# eccodes filter that splits the consolidated BUFR into per-type files.
# See conv_bufr_split.filter for the full list of categories handled.
conv_bufr_filter = "/perm/nlcr/hm_lib/CY49T2h_AROME_3DVAR_2026_05_26/const/eccodes/filters/conv_bufr_split.filter"

# Obs types produced by the split.  Must exactly match the obstype keys
# below ([da.providers.UWC.obstypes.synop] etc.) and the items in
# obs_types_3dvar.  Types NOT listed here (amsua, iasi, ascat, seviri, ...)
# use their own candidates lists and are unaffected by the split.
conv_split_types = [
  "synop",
  "amdar",
  "temp",
  "gpssol",
]

# ------------------------------------------------------------------
# Conventional obs — produced by conv_bufr split
# (no candidates needed; filenames must match filter write targets)
# ------------------------------------------------------------------

[da.providers.UWC.obstypes.synop]
format = "BUFR"

[da.providers.UWC.obstypes.amdar]
# The filter writes aircraft obs to BUFR.amdaromm (AMDAR OMM format).
local_name = "BUFR.amdaromm"

[da.providers.UWC.obstypes.temp]
format = "BUFR"

[da.providers.UWC.obstypes.gpssol]
format = "BUFR"

# ------------------------------------------------------------------
# Satellite and independently-sourced obs
# (normal candidates-based staging; unaffected by conv_bufr_source)
# ------------------------------------------------------------------

[da.providers.UWC.obstypes.amsua]
format     = "BUFR"
candidates = [
  "amsua{ymdrr}",
  "amsua{ymdrr}.bufr",
]

[da.providers.UWC.obstypes.amsub]
format     = "BUFR"
candidates = [
  "amsub{ymdrr}",
  "amsub{ymdrr}.bufr",
]

[da.providers.UWC.obstypes.ascat]
format     = "BUFR"
candidates = [
  "ascat{ymdrr}",
  "ascat{ymdrr}.bufr",
]

[da.providers.UWC.obstypes.atms]
format     = "BUFR"
candidates = [
  "atms{ymdrr}",
  "atms{ymdrr}.bufr",
]

[da.providers.UWC.obstypes.cris]
format     = "BUFR"
candidates = [
  "cris{ymdrr}",
  "cris{ymdrr}.bufr",
]

[da.providers.UWC.obstypes.geowind]
format     = "BUFR"
candidates = [
  "geow{ymdrr}",
  "geow{ymdrr}.bufr",
]

[da.providers.UWC.obstypes.iasi]
format     = "BUFR"
candidates = [
  "iasi{ymdrr}",
  "iasi{ymdrr}.bufr",
]

[da.providers.UWC.obstypes.mwhs]
format     = "BUFR"
candidates = [
  "mwhs{ymdrr}",
  "mwhs{ymdrr}.bufr",
]

[da.providers.UWC.obstypes.seviri]
format     = "NETCDF"
candidates = ["{ymdrr}_00_seviri.nc"]

[da.providers.UWC.obstypes.modes]
format     = "BUFR"
candidates = [
  "Mode-S_EMADDC_KNMI_oper_{ymdrr}.bufr",
  "modes{ymdrr}.bufr",
]

# Unknown
# GPS
#-rw-r----- 1 nlcr accord    121730 Feb  9  2025 GPS2025020900
# mwts
#-rw-r----- 1 nlcr accord         0 Feb  9  2025 mwts2025020900

# ------------------------------------------------------------------
# RMI — Royal Meteorological Institute of Belgium.
